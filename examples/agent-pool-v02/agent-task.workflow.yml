# TEMPLATE ONLY: copy into .github/workflows/agent-task.yml of a PRIVATE runtime repo.
# Do not activate this file in the public life-os repository.
name: Life OS Agent Task
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent-task:
    if: >-
      github.event.repository.private == true &&
      github.event.issue.pull_request == null &&
      github.event.label.name == 'agent-run-approved' &&
      startsWith(github.event.issue.title, '[AGENT]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AGENT_TASK_ID: issue-${{ github.event.issue.number }}
      AGENT_TASK_TEXT: ${{ github.event.issue.body }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout private runner
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prevent duplicate completed runs
        shell: bash
        run: |
          if gh issue view "$ISSUE_NUMBER" --json comments --jq \
            '.comments[].body | select(startswith("<!-- agent-v02-completed -->"))' | grep -q .; then
            echo 'This issue already has a completed agent run. Refusing another paid execution.'
            exit 1
          fi

      - name: Execute bounded three-stage Agent task
        # Repo owner has authorized API calls by applying agent-run-approved label.
        run: python agent_runner.py --execute

      - name: Upload report and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result-${{ github.event.issue.number }}
          path: output/
          retention-days: 14
          if-no-files-found: warn

      - name: Return report to the private issue
        if: success()
        shell: bash
        run: |
          {
            echo '<!-- agent-v02-completed -->'
            echo ''
            cat "output/issue-$ISSUE_NUMBER/report.md"
          } > /tmp/agent-issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/agent-issue-comment.md
