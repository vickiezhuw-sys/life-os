name: Agent Inbox - Acceptance
on:
  push:
    paths: ['src/**', 'tests/**', 'package*.json', '.github/workflows/agent-inbox-ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'package*.json', '.github/workflows/agent-inbox-ci.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.js
      - run: npm run build
